<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOXORA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#12161C; --surface:#F3F5F7; --card:#FFFFFF; --border:#E1E5EA;
  --text:#12161C; --muted:#667085; --muted-2:#98A1AE;
  --accent:#0E7C79; --accent-ink:#08514F; --accent-soft:#E4F3F1;
  --success:#1F8B5C; --success-soft:#E6F5EC;
  --warning:#B4780F; --warning-soft:#FBF0DE;
  --danger:#C2412E; --danger-soft:#FBE9E6;
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --shadow:0 1px 2px rgba(18,22,28,.04);
  color-scheme: light;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F3F5F7; --surface:#0B0D11; --card:#151920; --border:#252B34;
    --text:#F3F5F7; --muted:#9AA3B2; --muted-2:#6E7684;
    --accent:#22A79E; --accent-ink:#8FE0D6; --accent-soft:#132723;
    --success:#3FBE84; --success-soft:#0F241B;
    --warning:#E0A73E; --warning-soft:#2A2013;
    --danger:#E2685A; --danger-soft:#2A1512;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F3F5F7; --surface:#0B0D11; --card:#151920; --border:#252B34;
  --text:#F3F5F7; --muted:#9AA3B2; --muted-2:#6E7684;
  --accent:#22A79E; --accent-ink:#8FE0D6; --accent-soft:#132723;
  --success:#3FBE84; --success-soft:#0F241B;
  --warning:#E0A73E; --warning-soft:#2A2013;
  --danger:#E2685A; --danger-soft:#2A1512;
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--surface); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  min-height:100vh;
}
[dir="rtl"] body{ font-family:'Noto Kufi Arabic','Inter',system-ui,sans-serif; }
.app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--surface); position:relative; display:flex; flex-direction:column; }
.scroll-area{ flex:1; overflow-x:hidden; padding-bottom:86px; }
img,svg{max-width:100%;}
button{font-family:inherit;}
a{color:inherit;}

/* ---------- Header ---------- */
.topbar{ position:sticky; top:0; z-index:20; background:var(--surface); padding:18px 20px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.topbar h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em; }
.topbar .back{ display:flex; align-items:center; gap:10px; }
.icon-btn{ width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex:none; }
.icon-btn:active{ transform:scale(0.96); }

/* ---------- Bottom nav ---------- */
.tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--border); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:30; }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; border-radius:10px; cursor:pointer; color:var(--muted-2); background:none; border:none; }
.tab.active{ color:var(--accent); }
.tab span.label{ font-size:10.5px; font-weight:600; }
.tab svg{ width:22px; height:22px; }

/* ---------- Generic ---------- */
.px{ padding-left:20px; padding-right:20px; }
.section-title{ font-size:13px; font-weight:700; color:var(--muted); text-transform:none; margin:22px 20px 10px; letter-spacing:0; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px; box-shadow:var(--shadow); }
.stack{ display:flex; flex-direction:column; gap:12px; padding:0 20px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.row + .row{ margin-top:10px; }
.muted{ color:var(--muted); }
.small{ font-size:12.5px; }
.big-num{ font-size:30px; font-weight:800; letter-spacing:-0.02em; }
.badge{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:100px; font-size:12px; font-weight:600; }
.badge.success{ background:var(--success-soft); color:var(--success); }
.badge.warning{ background:var(--warning-soft); color:var(--warning); }
.badge.danger{ background:var(--danger-soft); color:var(--danger); }
.badge.neutral{ background:var(--surface); color:var(--muted); border:1px solid var(--border); }
.dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }

.btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 16px; border-radius:var(--radius-s); font-weight:700; font-size:15px; border:1px solid transparent; cursor:pointer; }
.btn:active{ transform:scale(0.985); }
.btn-primary{ background:var(--accent); color:#fff; }
.btn-secondary{ background:var(--card); color:var(--text); border-color:var(--border); }
.btn-ghost{ background:transparent; color:var(--accent); }
.btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger-soft); }
.btn-sm{ padding:9px 14px; font-size:13px; width:auto; }

.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--muted); }
.field input, .field select, .field textarea{
  border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:var(--radius-s); padding:12px 13px; font-size:14.5px; font-family:inherit; width:100%;
}
.field textarea{ resize:vertical; min-height:80px; line-height:1.5; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:0; }
.hint{ font-size:12px; color:var(--muted-2); }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:8px 13px; border-radius:100px; border:1px solid var(--border); font-size:13px; font-weight:600; background:var(--card); color:var(--text); cursor:pointer; }
.chip.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
.switch{ position:relative; width:44px; height:26px; border-radius:100px; background:var(--border); flex:none; cursor:pointer; transition:.15s; }
.switch.on{ background:var(--accent); }
.switch .knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; }
[dir="rtl"] .switch .knob{ left:auto; right:3px; }
.switch.on .knob{ left:21px; }
[dir="rtl"] .switch.on .knob{ left:auto; right:21px; }

.empty{ text-align:center; padding:44px 24px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.empty .icon{ width:52px; height:52px; border-radius:16px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
.empty h3{ margin:0; font-size:15.5px; font-weight:700; }
.empty p{ margin:0; color:var(--muted); font-size:13.5px; max-width:280px; line-height:1.5; }

.list-item{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
.list-item:last-child{ border-bottom:none; }
.list-item:active{ background:var(--surface); }
.avatar{ width:40px; height:40px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none; }

.settings-group{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); overflow:hidden; }
.settings-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
.settings-row:last-child{ border-bottom:none; }
.settings-row:active{ background:var(--surface); }
.settings-row .ic{ width:32px; height:32px; border-radius:9px; background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none; color:var(--accent-ink); }
.settings-row .txt{ flex:1; min-width:0; }
.settings-row .txt .t1{ font-size:14.5px; font-weight:600; }
.settings-row .txt .t2{ font-size:12px; color:var(--muted); margin-top:1px; }
.chev{ color:var(--muted-2); flex:none; }
[dir="rtl"] .chev{ transform:scaleX(-1); }

.toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:11px 18px; border-radius:100px; font-size:13.5px; font-weight:600; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:88%; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.2); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

.plan-card{ border:1.5px solid var(--border); border-radius:var(--radius-m); padding:16px; background:var(--card); position:relative; }
.plan-card.selected{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.plan-card .price{ font-size:24px; font-weight:800; }
.plan-card .price span{ font-size:13px; font-weight:600; color:var(--muted); }

.photo-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.photo-add-tile{ width:84px; height:84px; border-radius:12px; border:1.5px dashed var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--muted); cursor:pointer; background:var(--card); flex:none; }
.photo-add-tile span.n{ font-size:10.5px; font-weight:600; }
.source-row{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.source-row:last-child{ border-bottom:none; }
.source-thumb{ width:64px; height:64px; border-radius:10px; overflow:hidden; flex:none; border:1px solid var(--border); background:var(--surface); }
.source-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.source-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.source-actions{ display:flex; gap:8px; }
.source-actions button{ font-size:12px; font-weight:600; padding:5px 10px; border-radius:100px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
.source-actions button.danger{ color:var(--danger); border-color:var(--danger-soft); }

.lang-screen, .welcome-screen, .auth-screen{ min-height:100vh; display:flex; flex-direction:column; padding:28px 24px; }
.logo-mark{ width:56px; height:56px; border-radius:16px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; }
.tabs-inline{ display:flex; background:var(--surface); border-radius:12px; padding:4px; gap:4px; }
.tabs-inline button{ flex:1; padding:10px; border-radius:9px; border:none; background:none; font-weight:700; font-size:14px; color:var(--muted); cursor:pointer; }
.tabs-inline button.active{ background:var(--card); color:var(--text); box-shadow:var(--shadow); }

.notice{ display:flex; gap:10px; padding:12px 14px; border-radius:var(--radius-s); background:var(--warning-soft); color:var(--warning); font-size:12.5px; line-height:1.5; align-items:flex-start; }
.notice.info{ background:var(--accent-soft); color:var(--accent-ink); }
::selection{ background:var(--accent-soft); }
.divider{ height:1px; background:var(--border); margin:6px 20px; }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   VOXORA — data layer, backed by a real Supabase project
   (Voxora, project ref hsyrztbvpqrqovbdbyae). Auth is real
   Supabase Auth; all business/AI/phone/recording/notification/
   subscription/booking/knowledge-source data is read from and
   written to real Postgres tables behind RLS, scoped to the
   signed-in user's own business. Only the publishable client
   key is embedded here — safe to expose, enforced by RLS.
   Nothing here fabricates business activity: calls, bookings
   and summaries only ever come from real user input or a
   connected backend/telephony provider.
========================================================= */
const SUPABASE_URL = 'https://hsyrztbvpqrqovbdbyae.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_46k7TbmVFImmYxPF4nK3lw_KyynZZca';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'voxora-auth' }
});
const KNOWLEDGE_BUCKET = 'business-knowledge';

// Local-only device preference (which language the app UI itself is shown in).
// This is not app/user data — it's a client display setting, so it stays local.
function readLocalAppLang(){ try{ return localStorage.getItem('voxora:appLang') || null; }catch(e){ return null; } }
function writeLocalAppLang(v){ try{ localStorage.setItem('voxora:appLang', v); }catch(e){} }

// SINGLE SOURCE OF TRUTH for all subscription pricing/minutes.
// Every screen (Dashboard, Billing, Settings) reads plan price/minutes
// from this array only — nothing else hardcodes a price or minute count.
// Changing a value here updates it everywhere automatically.
const PLANS = [
  { id:'starter',    minutes:200,  price:39.99 },
  { id:'business',   minutes:500,  price:89.99 },
  { id:'pro',        minutes:1000, price:149.99 },
  { id:'enterprise', minutes:2000, price:270.99 },
];

const CALL_LANGS = [
  {id:'ar', native:'العربية'}, {id:'en', native:'English'}, {id:'de', native:'Deutsch'},
  {id:'fr', native:'Français'}, {id:'es', native:'Español'}, {id:'tr', native:'Türkçe'},
];

function emptyState_(){
  return {
    appLang: readLocalAppLang(),
    user: null,
    businessId: null,
    onboardStep: 'welcome',
    business: { services: [], faqs: [] },
    ai: { style:'friendly', primaryLang:'en', extraLangs:[], fallback:'offer_human', handoff:{asked:true, missingInfo:true, custom:false}, bookingBehavior:'auto', instructions:'', businessInstructions:'', greeting:'' },
    phone: { connected:false, number:'', provider:'' },
    recording: { enabled:false, consentNote:'' },
    notifPrefs: { important_call:true, human_handoff:true, booking:true, failed_call:true, usage_limit:true, billing:true, daily_summary:true },
    subscription: { planId:null, status:'inactive', minutesUsed:0, periodStart:null },
    calls: [],
    bookings: [],
    route: 'dashboard',
    routeParam: null,
    booting: true,
  };
}
let state = emptyState_();
const sourceThumbUrls = {}; // business_knowledge_sources.id -> signed Storage URL, filled by loadAllData()

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(()=>el.classList.remove('show'), 2000);
}
function errMsg(e){ return (e && (e.message || e.error_description || e.msg)) || String(e); }

function nav(route, param){ state.route = route; state.routeParam = param || null; window.scrollTo(0,0); render(); }
function go(step){ state.onboardStep = step; render(); }

/* ---------------------------------------------------------
   Load every real row for the signed-in user's business into
   `state`, in the exact shapes the existing screens expect.
--------------------------------------------------------- */
async function ensureBusinessRow(userId){
  let { data, error } = await sb.from('businesses').select('*').eq('owner_id', userId).maybeSingle();
  if(error) throw error;
  if(!data){
    const ins = await sb.from('businesses').insert({ owner_id: userId }).select('*').single();
    if(ins.error) throw ins.error;
    data = ins.data;
  }
  return data;
}

function mapBusinessRow(b){
  return {
    businessName: b.name || '', country: b.country || '', city: b.city || '',
    address: b.address || '', landlineNumber: b.landline_number || '', mobileNumber: b.mobile_number || '',
    industry: b.industry || '', description: b.description || '', openingHours: b.opening_hours || '',
    importantInfo: b.important_info || '', contactInfo: b.contact_info || '',
    services: Array.isArray(b.services) ? b.services : [], faqs: Array.isArray(b.faqs) ? b.faqs : [],
    photos: [], // filled separately from business_knowledge_sources
  };
}

async function loadAllData(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;
  state.user = { id:user.id, name: (user.user_metadata && user.user_metadata.name) || '', email: user.email };

  const biz = await ensureBusinessRow(user.id);
  state.businessId = biz.id;
  state.business = mapBusinessRow(biz);

  const [aiSettingsRes, aiLangsRes, callSettingsRes, recordingRes, phoneRes, notifRes, subRes, usageRes, sourcesRes, callsRes, bookingsRes] = await Promise.all([
    sb.from('ai_settings').select('*').eq('business_id', biz.id).maybeSingle(),
    sb.from('ai_languages').select('*').eq('business_id', biz.id),
    sb.from('call_settings').select('*').eq('business_id', biz.id).maybeSingle(),
    sb.from('recording_settings').select('*').eq('business_id', biz.id).maybeSingle(),
    sb.from('phone_connections').select('*').eq('business_id', biz.id).maybeSingle(),
    sb.from('notification_prefs').select('*').eq('business_id', biz.id).maybeSingle(),
    sb.from('subscriptions').select('*').eq('business_id', biz.id).maybeSingle(),
    sb.from('usage_records').select('*').eq('business_id', biz.id).order('period_start', {ascending:false}).limit(1),
    sb.from('business_knowledge_sources').select('*').eq('business_id', biz.id).order('position', {ascending:true}),
    sb.from('calls').select('*, call_summaries(summary)').eq('business_id', biz.id).order('started_at', {ascending:false}),
    sb.from('bookings').select('*').eq('business_id', biz.id).order('created_at', {ascending:false}),
  ]);

  const ai = aiSettingsRes.data;
  const langs = aiLangsRes.data || [];
  const primary = langs.find(l=>l.is_primary);
  const extra = langs.filter(l=>!l.is_primary).map(l=>l.language_code);
  const cs = callSettingsRes.data;
  state.ai = {
    style: (ai && ai.tone) || 'friendly',
    primaryLang: (primary && primary.language_code) || 'en',
    extraLangs: extra,
    fallback: (ai && ai.fallback_behavior) || 'offer_human',
    handoff: {
      asked: cs ? !!cs.handoff_ask_before : true,
      missingInfo: cs ? !!cs.handoff_missing_info : true,
      custom: cs ? !!cs.handoff_custom_rule : false,
    },
    bookingBehavior: (ai && ai.booking_behavior) || 'auto',
    instructions: (ai && ai.instructions) || '',
    businessInstructions: (ai && ai.business_instructions) || '',
    greeting: (ai && ai.greeting_message) || '',
  };

  const rec = recordingRes.data;
  state.recording = { enabled: rec ? !!rec.recording_enabled : false, consentNote: (rec && rec.consent_message) || '' };

  const ph = phoneRes.data;
  state.phone = { connected: ph ? ph.status === 'connected' : false, number: (ph && ph.phone_number) || '', provider: (ph && ph.provider) || '' };

  const np = notifRes.data;
  state.notifPrefs = np ? {
    important_call: !!np.notify_on_call, human_handoff: !!np.notify_human_handoff, booking: !!np.notify_on_booking,
    failed_call: !!np.notify_failed_call, usage_limit: !!np.notify_usage_limit, billing: !!np.notify_billing,
    daily_summary: !!np.notify_daily_summary,
  } : state.notifPrefs;

  const sub = subRes.data;
  const usage = (usageRes.data && usageRes.data[0]) || null;
  state.subscription = sub ? {
    planId: sub.plan_code, status: sub.status, minutesUsed: usage ? Number(usage.used_minutes)||0 : 0,
    periodStart: sub.current_period_start,
  } : { planId:null, status:'inactive', minutesUsed:0, periodStart:null };

  state.business.photos = (sourcesRes.data || []).map(s => ({ id: s.id, name: s.file_name, note: s.note || '', storagePath: s.storage_path }));
  await Promise.all(state.business.photos.map(async p=>{
    try{
      const { data, error } = await sb.storage.from(KNOWLEDGE_BUCKET).createSignedUrl(p.storagePath, 3600);
      if(!error) sourceThumbUrls[p.id] = data.signedUrl;
    }catch(e){ /* thumbnail just won't render if signing fails */ }
  }));

  state.calls = (callsRes.data || []).map(c => ({
    id: c.id, caller: c.caller_name || c.caller_number || 'Unknown caller',
    date: c.started_at ? new Date(c.started_at).toLocaleString() : '—',
    duration: c.duration_seconds ? Math.round(c.duration_seconds/60)+'m' : '—',
    transferred: !!c.transferred_to_human, language: c.language_used || '',
    summary: c.call_summaries && c.call_summaries.length ? c.call_summaries[0].summary : (c.call_summaries && c.call_summaries.summary) || null,
  }));

  state.bookings = (bookingsRes.data || []).map(b => ({
    id: b.id, customer: b.customer_name, service: b.service || '—',
    date: b.booking_date || '', time: b.booking_time_text || '', notes: b.notes || '', status: b.status,
  }));
}

function resetToSignedOut(){
  state = emptyState_();
  state.booting = false;
  authMode = 'login'; authForgot = false;
}

/* =========================================================
   Translations
========================================================= */
const STR = {
  appName: { en:'VOXORA', de:'VOXORA', ar:'VOXORA' },
  tagline: { en:'Your AI voice assistant, answering every business call.', de:'Ihr KI-Sprachassistent für jeden Geschäftsanruf.', ar:'مساعدك الصوتي الذكي، يرد على كل مكالمة عمل.' },
  getStarted: { en:'Get started', de:'Loslegen', ar:'ابدأ الآن' },
  chooseLanguage: { en:'Choose your app language', de:'Wählen Sie Ihre App-Sprache', ar:'اختر لغة التطبيق' },
  chooseLanguageSub: { en:'You can change this anytime in Settings. This only changes the app — not the language the AI speaks on calls.', de:'Sie können dies jederzeit in den Einstellungen ändern. Dies betrifft nur die App — nicht die Sprache der KI bei Anrufen.', ar:'يمكنك تغيير هذا في أي وقت من الإعدادات. هذا يغيّر التطبيق فقط، وليس لغة المكالمات.' },
  continue: { en:'Continue', de:'Weiter', ar:'متابعة' },
  login: { en:'Log in', de:'Anmelden', ar:'تسجيل الدخول' },

/* =========================================================
   Root render
========================================================= */
function render(){
  const root = document.getElementById('root');
  document.documentElement.dir = state.appLang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = state.appLang || 'en';

  if(state.booting){
    root.innerHTML = `<div class="welcome-screen"><div style="flex:1;display:flex;align-items:center;justify-content:center;"><div class="logo-mark">${icon('phone',28)}</div></div></div>`;
    return;
  }

  if(!state.user){
    root.innerHTML = screenOnboarding();
  } else {
    root.innerHTML = `<div class="app">
      <div class="scroll-area" id="scrollArea">${screenRouter()}</div>
      ${tabbar()}
    </div>`;
  }
  bindEvents();
}

function screenOnboarding(){
  if(state.onboardStep === 'welcome'){
    return welcomeScreen();
  }
  if(state.onboardStep === 'language'){
    return languageScreen(true);
  }
  return authScreen();
}

/* =========================================================
   Router for main app
========================================================= */
function screenRouter(){
  switch(state.route){
    case 'dashboard': return dashboardScreen();
    case 'calls': return callsScreen();
    case 'call-detail': return callDetailScreen(state.routeParam);
    case 'bookings': return bookingsScreen();
    case 'summaries': return summariesScreen();
    case 'settings': return settingsHome();
    case 'settings-account': return settingsAccount();
    case 'settings-business': return settingsBusiness();
    case 'settings-ai': return settingsAI();
    case 'settings-phone': return settingsPhone();
    case 'settings-callsettings': return settingsCallSettings();
    case 'settings-notifications': return settingsNotifications();
    case 'settings-billing': return settingsBilling();
    case 'settings-plans': return settingsPlans();
    case 'settings-language': return languageScreen(false);
    case 'settings-security': return settingsSecurity();
    default: return dashboardScreen();
  }
}

function header(title, opts){
  opts = opts || {};
  return `<div class="topbar">
    <div class="back">
      ${opts.back ? `<button class="icon-btn" data-back="${opts.back}">${icon('back',18)}</button>` : ''}
      <h1>${title}</h1>
    </div>
    ${opts.right || ''}
  </div>`;
}

function tabbar(){
  const tabs = [
    {id:'dashboard', label:T('dashboard'), icon:'home'},
    {id:'calls', label:T('calls'), icon:'phone'},
    {id:'bookings', label:T('bookings'), icon:'calendar'},
    {id:'summaries', label:T('summaries'), icon:'doc'},
    {id:'settings', label:T('settings'), icon:'gear'},
  ];
  const active = ['settings-account','settings-business','settings-ai','settings-phone','settings-callsettings','settings-notifications','settings-billing','settings-plans','settings-language','settings-security'].includes(state.route) ? 'settings' : (state.route==='call-detail' ? 'calls' : state.route);
  return `<div class="tabbar">
    ${tabs.map(t => `<button class="tab ${active===t.id?'active':''}" data-tab="${t.id}">${icon(t.icon,21)}<span class="label">${t.label}</span></button>`).join('')}
  </div>`;
}

/* ---------- Dashboard ---------- */
function dashboardScreen(){
  const plan = PLANS.find(p => p.id === state.subscription.planId);
  const totalCalls = state.calls.length;
  const handled = state.calls.filter(c=>!c.transferred).length;
  const transferred = state.calls.filter(c=>c.transferred).length;
  const minutesUsed = state.subscription.minutesUsed || 0;
  const minutesTotal = plan ? plan.minutes : 0;
  const pct = plan ? Math.min(100, Math.round((minutesUsed/minutesTotal)*100)) : 0;

  return `
  ${header('VOXORA', { right: `<button class="icon-btn" data-nav="settings-notifications">${icon('bell',17)}</button>` })}
  <div class="px" style="margin-bottom:4px;">
    <div class="muted small">${greetingLine()}</div>
  </div>

  <div class="section-title" style="margin-top:14px;">${T('callsOverview')}</div>
  <div class="stack">
    <div class="card">
      <div class="row">
        <div><div class="big-num">${totalCalls}</div><div class="small muted">${T('totalCalls')}</div></div>
        <div><div class="big-num">${handled}</div><div class="small muted">${T('handled')}</div></div>
        <div><div class="big-num">${transferred}</div><div class="small muted">${T('transferred')}</div></div>
      </div>
    </div>
  </div>

  <div class="section-title">${T('minutesUsage')}</div>
  <div class="stack">
    <div class="card">
      ${plan ? `
        <div class="row" style="margin-bottom:10px;">
          <div class="small muted">${minutesUsed} ${T('used')} · ${minutesTotal-minutesUsed} ${T('remaining')}</div>
          <div class="small" style="font-weight:700;">${pct}%</div>
        </div>
        <div style="height:8px;border-radius:8px;background:var(--surface);overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:8px;"></div>
        </div>
      ` : `
        <div class="row">
          <span class="muted small">${T('noPlan')}</span>
          <button class="btn btn-primary btn-sm" data-nav="settings-plans">${T('choosePlan')}</button>
        </div>
      `}
    </div>
  </div>

  <div class="section-title">${T('phoneConnection')}</div>
  <div class="stack">
    <div class="card row">
      <div class="row" style="gap:10px;">
        <span style="color:${state.phone.connected?'var(--success)':'var(--muted-2)'};">${icon('sim',20)}</span>
        <div>
          <div style="font-weight:700;font-size:14px;">${state.phone.connected? (state.phone.number||T('connected')) : T('notConnected')}</div>
          <div class="small muted">${state.phone.connected? state.phone.provider : ''}</div>
        </div>
      </div>
      ${!state.phone.connected ? `<button class="btn btn-secondary btn-sm" data-nav="settings-phone">${T('connectNow')}</button>` : `<span class="badge success">${T('connected')}</span>`}
    </div>
  </div>

  <div class="section-title">${T('recentCalls')}</div>
  <div class="stack">
    <div class="card" style="padding:0;">
      ${state.calls.length ? state.calls.slice(0,3).map(callRow).join('') : emptyState('inbox', T('noCallsTitle'), T('noCallsBody'))}
    </div>
    ${state.calls.length ? `<button class="btn btn-ghost btn-sm" data-nav="calls" style="align-self:flex-start;">${T('viewAll')}</button>` : ''}
  </div>

  <div class="section-title">${T('dailySummary')}</div>
  <div class="stack">
    <div class="card">${emptyState('doc', T('noDailyTitle'), T('noDailyBody'), true)}</div>
  </div>

  <div class="section-title">${T('currentPlan')}</div>
  <div class="stack" style="margin-bottom:10px;">
    <div class="card row">
      <div>
        <div style="font-weight:700;">${plan ? planName(plan.id) : T('noPlan')}</div>
        ${plan ? `<div class="small muted">€${plan.price.toFixed(2)}${T('perMonth')} · ${plan.minutes} ${T('minutesIncluded')}</div>` : ''}
      </div>
      <button class="btn btn-secondary btn-sm" data-nav="settings-plans">${plan? T('managePlan') : T('choosePlan')}</button>
    </div>
  </div>
  `;
}
function greetingLine(){
  const name = (state.user && state.user.name) ? state.user.name.split(' ')[0] : (state.user? state.user.email : '');
  const biz = state.business.businessName ? ' · ' + state.business.businessName : '';
  return `${name}${biz}`;
}
function planName(id){

}

/* =========================================================
   Events
========================================================= */
function bindEvents(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> nav(el.getAttribute('data-nav'), el.getAttribute('data-param')));
  });
  root.querySelectorAll('[data-back]').forEach(el=>{
    el.addEventListener('click', ()=> nav(el.getAttribute('data-back')));
  });
  root.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=> nav(el.getAttribute('data-tab')));
  });

  // Welcome
  const btnStart = document.getElementById('btnWelcomeStart');
  if(btnStart) btnStart.addEventListener('click', ()=> go('language'));

  // Language select (onboarding + settings)
  root.querySelectorAll('.lang-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      setAppLang(el.getAttribute('data-lang'));
      render();
    });
  });
  const btnLangContinue = document.getElementById('btnLangContinue');
  if(btnLangContinue) btnLangContinue.addEventListener('click', ()=> state.appLang && go('auth'));
  const btnBackSettings = document.getElementById('btnBackSettings');
  if(btnBackSettings) btnBackSettings.addEventListener('click', ()=> nav('settings'));

  // Auth
  const btnBackToLang = document.getElementById('btnBackToLang');
  if(btnBackToLang) btnBackToLang.addEventListener('click', ()=>{ authForgot=false; go('language'); });
  root.querySelectorAll('[data-authmode]').forEach(el=>{
    el.addEventListener('click', ()=>{ authMode = el.getAttribute('data-authmode'); render(); });
  });
  const togglePw = document.getElementById('togglePw');
  if(togglePw) togglePw.addEventListener('click', ()=>{
    const pw = document.getElementById('pwField');
    if(pw.type === 'password'){ pw.type = 'text'; togglePw.textContent = '🙈'; }
    else { pw.type = 'password'; togglePw.textContent = '👁'; }
  });
  const authForm = document.getElementById('authForm');
  if(authForm) authForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(authForm);
    const email = (fd.get('email')||'').trim().toLowerCase();
    const password = fd.get('password')||'';
    const submitBtn = authForm.querySelector('button[type=submit]');
    if(submitBtn) submitBtn.disabled = true;
    try{
      if(authMode === 'signup'){
        const name = fd.get('name') || '';
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
        if(error){ toast(errMsg(error)); return; }
        if(!data.session){
          toast(state.appLang==='de'?'Bitte bestätigen Sie Ihre E-Mail, um sich anzumelden.':state.appLang==='ar'?'يرجى تأكيد بريدك الإلكتروني لتسجيل الدخول.':'Please confirm your email to finish signing in.');
          authMode = 'login'; render(); return;
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error){ toast(errMsg(error)); return; }
      }
      state.booting = true; render();
      await loadAllData();
      state.booting = false;
      nav('dashboard');
    }catch(err){ state.booting=false; toast(errMsg(err)); render(); }
    finally{ if(submitBtn) submitBtn.disabled = false; }
  });
  const btnForgot = document.getElementById('btnForgot');
  if(btnForgot) btnForgot.addEventListener('click', ()=>{ authForgot = true; render(); });
  const btnBackLogin = document.getElementById('btnBackLogin');
  if(btnBackLogin) btnBackLogin.addEventListener('click', ()=>{ authForgot=false; authMode='login'; render(); });
  const forgotForm_ = document.getElementById('forgotForm');
  if(forgotForm_) forgotForm_.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(forgotForm_);
    const email = (fd.get('email')||'').trim().toLowerCase();
    try{ await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href }); }catch(err){ /* fall through to generic message regardless, so we never reveal whether an email exists */ }
    toast(T('resetLinkSent')); authForgot=false; authMode='login'; render();
  });

  // Logout
  ['btnLogout','btnLogout2','btnLogout3'].forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.addEventListener('click', async ()=>{
      await sb.auth.signOut();
      resetToSignedOut();
      render();
    });
  });

  // Bookings modal
  const openModal = ()=>{
    let m = document.getElementById('bookingModalRoot');
    if(!m){ m = document.createElement('div'); m.id='bookingModalRoot'; document.body.appendChild(m); }
    m.innerHTML = bookingFormHtml();
    document.getElementById('btnCancelBooking').addEventListener('click', ()=> m.innerHTML='');
    document.getElementById('bookingModalBg').addEventListener('click', e=>{ if(e.target.id==='bookingModalBg') m.innerHTML=''; });
    document.getElementById('bookingForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const row = {
        business_id: state.businessId, customer_name: fd.get('customer'), service: fd.get('service')||'—',
        booking_date: fd.get('date')||null, booking_time_text: fd.get('time')||null, notes: fd.get('notes')||null, status: 'confirmed',
      };
      const { data, error } = await sb.from('bookings').insert(row).select('*').single();
      if(error){ toast(errMsg(error)); return; }
      state.bookings.unshift({ id:data.id, customer:data.customer_name, service:data.service, date:data.booking_date, time:data.booking_time_text, notes:data.notes, status:data.status });
      m.innerHTML=''; render(); toast(T('savedChanges'));
    });
  };
  const ab1 = document.getElementById('btnAddBooking'); if(ab1) ab1.addEventListener('click', openModal);
  const ab2 = document.getElementById('btnAddBooking2'); if(ab2) ab2.addEventListener('click', openModal);

  // Settings: account
  const btnSaveAccount = document.getElementById('btnSaveAccount');
  if(btnSaveAccount) btnSaveAccount.addEventListener('click', async ()=>{
    const name = document.getElementById('accName').value;
    const { error } = await sb.auth.updateUser({ data: { name } });
    if(error){ toast(errMsg(error)); return; }
    state.user.name = name; toast(T('savedChanges')); render();
  });

  // Settings: business
  const btnSaveBusiness = document.getElementById('btnSaveBusiness');
  if(btnSaveBusiness) btnSaveBusiness.addEventListener('click', async ()=>{
    const card = btnSaveBusiness.closest('.card');
    const vals = {};
    card.querySelectorAll('[name]').forEach(inp=>{ vals[inp.name] = inp.value; state.business[inp.name] = inp.value; });
    const row = {
      name: vals.businessName||null, country: vals.country||null, city: vals.city||null, address: vals.address||null,
      landline_number: vals.landlineNumber||null, mobile_number: vals.mobileNumber||null, industry: vals.industry||null,
      description: vals.description||null, opening_hours: vals.openingHours||null, important_info: vals.importantInfo||null,
      contact_info: vals.contactInfo||null,
    };
    const { error } = await sb.from('businesses').update(row).eq('id', state.businessId);
    if(error){ toast(errMsg(error)); return; }
    toast(T('savedChanges')); render();
  });
  async function persistServices(){
    const { error } = await sb.from('businesses').update({ services: state.business.services }).eq('id', state.businessId);
    if(error) toast(errMsg(error));
  }
  async function persistFaqs(){
    const { error } = await sb.from('businesses').update({ faqs: state.business.faqs }).eq('id', state.businessId);
    if(error) toast(errMsg(error));
  }
  const btnAddService = document.getElementById('btnAddService');
  if(btnAddService) btnAddService.addEventListener('click', ()=>{
    const name = prompt(T('serviceName')); if(!name) return;
    const price = prompt(T('price')) || '';
    const currency = prompt(T('currency')) || (state.business.currency||'EUR');
    state.business.services = state.business.services || [];
    state.business.services.push({name, price, currency});
    render(); persistServices();
  });
  root.querySelectorAll('[data-rmservice]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.business.services.splice(+el.getAttribute('data-rmservice'),1); render(); persistServices(); });
  });
  const btnAddFaq = document.getElementById('btnAddFaq');
  if(btnAddFaq) btnAddFaq.addEventListener('click', ()=>{
    const q = prompt(T('question')); if(!q) return;
    const a = prompt(T('answer')) || '';
    state.business.faqs = state.business.faqs || [];
    state.business.faqs.push({q,a});
    render(); persistFaqs();
  });
  root.querySelectorAll('[data-rmfaq]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.business.faqs.splice(+el.getAttribute('data-rmfaq'),1); render(); persistFaqs(); });
  });

  // Settings: business knowledge sources (Storage-backed)
  const photoInput = document.getElementById('photoFileInput');
  const btnAddPhoto = document.getElementById('btnAddPhoto');
  if(btnAddPhoto && photoInput) btnAddPhoto.addEventListener('click', ()=>{
    if((state.business.photos||[]).length >= 11){ toast(T('photoLimitReached')); return; }
    pendingPhotoReplaceId = null;
    photoInput.value = '';
    photoInput.click();
  });
  root.querySelectorAll('[data-replacephoto]').forEach(el=>{
    el.addEventListener('click', ()=>{
      pendingPhotoReplaceId = el.getAttribute('data-replacephoto');
      if(photoInput){ photoInput.value = ''; photoInput.click(); }
    });
  });
  root.querySelectorAll('[data-deletephoto]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-deletephoto');
      const src = (state.business.photos||[]).find(p=>p.id===id);
      if(!src) return;
      const { error: delErr } = await sb.from('business_knowledge_sources').delete().eq('id', id);
      if(delErr){ toast(errMsg(delErr)); return; }
      await sb.storage.from(KNOWLEDGE_BUCKET).remove([src.storagePath]);
      delete sourceThumbUrls[id];
      state.business.photos = (state.business.photos||[]).filter(p=>p.id!==id);
      render();
    });
  });
  root.querySelectorAll('[data-sourcenote]').forEach(el=>{
    el.addEventListener('blur', async ()=>{
      const id = el.getAttribute('data-sourcenote');
      const src = (state.business.photos||[]).find(p=>p.id===id);
      if(!src) return;
      src.note = el.value;
      const { error } = await sb.from('business_knowledge_sources').update({ note: el.value }).eq('id', id);
      if(error) toast(errMsg(error));
    });
  });
  if(photoInput) photoInput.addEventListener('change', async ()=>{
    const file = photoInput.files && photoInput.files[0];
    if(!file) return;
    if(!file.type || file.type.indexOf('image/') !== 0){ toast(T('photoTooLarge')); return; }
    if(file.size > MAX_PHOTO_BYTES){ toast(T('photoTooLarge')); return; }
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    const path = `${state.businessId}/${(pendingPhotoReplaceId||'src')}-${Date.now()}.${ext}`;
    try{
      if(pendingPhotoReplaceId){
        const idx = state.business.photos.findIndex(p=>p.id===pendingPhotoReplaceId);
        if(idx === -1){ pendingPhotoReplaceId = null; return; }
        const oldPath = state.business.photos[idx].storagePath;
        const { error: upErr } = await sb.storage.from(KNOWLEDGE_BUCKET).upload(path, file, { upsert:false });
        if(upErr){ toast(errMsg(upErr)); return; }
        const { error: dbErr } = await sb.from('business_knowledge_sources').update({ storage_path: path, file_name: file.name, mime_type: file.type, size_bytes: file.size }).eq('id', pendingPhotoReplaceId);
        if(dbErr){ toast(errMsg(dbErr)); return; }
        await sb.storage.from(KNOWLEDGE_BUCKET).remove([oldPath]);
        state.business.photos[idx] = { id: pendingPhotoReplaceId, name: file.name, note: state.business.photos[idx].note, storagePath: path };
        const { data: signed } = await sb.storage.from(KNOWLEDGE_BUCKET).createSignedUrl(path, 3600);
        if(signed) sourceThumbUrls[pendingPhotoReplaceId] = signed.signedUrl;
        pendingPhotoReplaceId = null;
      } else {
        if(state.business.photos.length >= 11){ toast(T('photoLimitReached')); return; }
        const { error: upErr } = await sb.storage.from(KNOWLEDGE_BUCKET).upload(path, file, { upsert:false });
        if(upErr){ toast(errMsg(upErr)); return; }
        const { data: row, error: dbErr } = await sb.from('business_knowledge_sources')
          .insert({ business_id: state.businessId, storage_path: path, file_name: file.name, mime_type: file.type, size_bytes: file.size, position: state.business.photos.length })
          .select('*').single();
        if(dbErr){ await sb.storage.from(KNOWLEDGE_BUCKET).remove([path]); toast(T('photoLimitReached')); return; }
        state.business.photos.push({ id: row.id, name: row.file_name, note: '', storagePath: row.storage_path });
        const { data: signed } = await sb.storage.from(KNOWLEDGE_BUCKET).createSignedUrl(path, 3600);
        if(signed) sourceThumbUrls[row.id] = signed.signedUrl;
      }
      render();
    }catch(err){ toast(errMsg(err)); }
  });

  // Settings: AI (all fields + toggles commit together via the Save button below)
  root.querySelectorAll('[data-toggle-lang]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const l = el.getAttribute('data-toggle-lang');
      const idx = state.ai.extraLangs.indexOf(l);
      if(idx>-1) state.ai.extraLangs.splice(idx,1); else state.ai.extraLangs.push(l);
      render();
    });
  });
  root.querySelectorAll('[data-style]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.ai.style = el.getAttribute('data-style'); render(); });
  });
  root.querySelectorAll('[data-toggle^="handoff-"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.getAttribute('data-toggle').replace('handoff-','');
      const map = {asked:'asked', missing:'missingInfo', custom:'custom'};
      state.ai.handoff[map[k]] = !state.ai.handoff[map[k]];
      render();
    });
  });
  const btnSaveAI = document.getElementById('btnSaveAI');
  if(btnSaveAI) btnSaveAI.addEventListener('click', async ()=>{
    const cards = document.querySelectorAll('#root .card');
    cards.forEach(card=>{
      card.querySelectorAll('[name]').forEach(inp=>{
        if(inp.name==='companyCountry'){ state.business.country = inp.value; }
        else { state.ai[inp.name] = inp.value; }
      });
    });
    try{
      const [{error:bizErr}, {error:aiErr}, {error:csErr}] = await Promise.all([
        sb.from('businesses').update({ country: state.business.country||null }).eq('id', state.businessId),
        sb.from('ai_settings').upsert({
          business_id: state.businessId, tone: state.ai.style, greeting_message: state.ai.greeting||null,
          instructions: state.ai.instructions||null, business_instructions: state.ai.businessInstructions||null,
          fallback_behavior: state.ai.fallback, booking_behavior: state.ai.bookingBehavior,
        }, { onConflict:'business_id' }),
        sb.from('call_settings').upsert({
          business_id: state.businessId, handoff_ask_before: state.ai.handoff.asked,
          handoff_missing_info: state.ai.handoff.missingInfo, handoff_custom_rule: state.ai.handoff.custom,
        }, { onConflict:'business_id' }),
      ]);
      if(bizErr||aiErr||csErr){ toast(errMsg(bizErr||aiErr||csErr)); return; }
      await sb.from('ai_languages').delete().eq('business_id', state.businessId);
      const langRows = [{ business_id: state.businessId, language_code: state.ai.primaryLang, is_primary: true }]
        .concat(state.ai.extraLangs.filter(l=>l!==state.ai.primaryLang).map(l=>({ business_id: state.businessId, language_code: l, is_primary: false })));
      const { error: langErr } = await sb.from('ai_languages').insert(langRows);
      if(langErr){ toast(errMsg(langErr)); return; }
      toast(T('savedChanges')); render();
    }catch(err){ toast(errMsg(err)); }
  });

  // Settings: phone
  const btnSetupPhone = document.getElementById('btnSetupPhone');
  if(btnSetupPhone) btnSetupPhone.addEventListener('click', async ()=>{
    const card = btnSetupPhone.closest('.card');
    const provider = card.querySelector('[name=provider]').value;
    const number = card.querySelector('[name=number]').value;
    if(!provider || !number){ toast(T('phoneNotConnectedNote')); return; }
    // Represents the handoff point to a real telephony provider; no live connection is made here.
    const { error } = await sb.from('phone_connections').upsert({ business_id: state.businessId, provider, phone_number: number, status: 'pending' }, { onConflict:'business_id' });
    if(error){ toast(errMsg(error)); return; }
    state.phone = { connected:false, provider, number };
    toast(state.appLang==='de'?'Für eine echte Verbindung ist ein Backend-Anbieter erforderlich.':state.appLang==='ar'?'يتطلب الاتصال الفعلي مزوّد خلفية حقيقي.':'A real connection requires a live backend provider.');
    render();
  });
  const btnDisconnectPhone = document.getElementById('btnDisconnectPhone');
  if(btnDisconnectPhone) btnDisconnectPhone.addEventListener('click', async ()=>{
    const { error } = await sb.from('phone_connections').upsert({ business_id: state.businessId, provider: state.phone.provider||'Telnyx', phone_number: null, status: 'not_connected' }, { onConflict:'business_id' });
    if(error){ toast(errMsg(error)); return; }
    state.phone = {connected:false, provider:'', number:''}; render();
  });

  // Settings: call settings / recording (toggle is visual until Save; Save commits both)
  root.querySelectorAll('[data-toggle="recording"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.recording.enabled = !state.recording.enabled; render(); });
  });
  const btnSaveRecording = document.getElementById('btnSaveRecording');
  if(btnSaveRecording) btnSaveRecording.addEventListener('click', async ()=>{
    const ta = document.querySelector('[name=consentNote]');
    state.recording.consentNote = ta ? ta.value : state.recording.consentNote;
    const { error } = await sb.from('recording_settings').upsert({ business_id: state.businessId, recording_enabled: state.recording.enabled, consent_message: state.recording.consentNote||null }, { onConflict:'business_id' });
    if(error){ toast(errMsg(error)); return; }
    toast(T('savedChanges')); render();
  });

  // Settings: notifications (each toggle persists immediately, matching the original instant-save UX)
  root.querySelectorAll('[data-notiftoggle]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const k = el.getAttribute('data-notiftoggle');
      state.notifPrefs[k] = !state.notifPrefs[k];
      render();
      const colMap = { important_call:'notify_on_call', human_handoff:'notify_human_handoff', booking:'notify_on_booking', failed_call:'notify_failed_call', usage_limit:'notify_usage_limit', billing:'notify_billing', daily_summary:'notify_daily_summary' };
      const patch = { business_id: state.businessId };
      patch[colMap[k]] = state.notifPrefs[k];
      const { error } = await sb.from('notification_prefs').upsert(patch, { onConflict:'business_id' });
      if(error) toast(errMsg(error));
    });
  });

  // Settings: billing / plans
  root.querySelectorAll('[data-selectplan]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-selectplan');
      const plan = PLANS.find(p=>p.id===id);
      const todayStr = new Date().toISOString().slice(0,10);
      const periodEnd = new Date(); periodEnd.setMonth(periodEnd.getMonth()+1);
      const { error: subErr } = await sb.from('subscriptions').upsert({
        business_id: state.businessId, plan_code: id, status: 'active', included_minutes: plan.minutes,
        price_cents: Math.round(plan.price*100), currency: 'EUR', billing_period: 'monthly',
        current_period_start: todayStr, current_period_end: periodEnd.toISOString().slice(0,10),
      }, { onConflict:'business_id' });
      if(subErr){ toast(errMsg(subErr)); return; }
      const { error: usageErr } = await sb.from('usage_records').upsert({
        business_id: state.businessId, period_start: todayStr, period_end: periodEnd.toISOString().slice(0,10),
        included_minutes: plan.minutes, used_minutes: 0,
      }, { onConflict:'business_id,period_start' });
      if(usageErr){ toast(errMsg(usageErr)); return; }
      state.subscription = { planId:id, status:'active', minutesUsed:0, periodStart: todayStr };
      toast(T('stripeNote')); render();
    });
  });
  const btnCancelSub = document.getElementById('btnCancelSub');
  if(btnCancelSub) btnCancelSub.addEventListener('click', async ()=>{
    if(!confirm(T('cancelSub')+'?')) return;
    const { error } = await sb.from('subscriptions').delete().eq('business_id', state.businessId);
    if(error){ toast(errMsg(error)); return; }
    state.subscription = { planId:null, status:'inactive', minutesUsed:0, periodStart:null }; render();
  });

  // Settings: security
  const btnChangePassword = document.getElementById('btnChangePassword');
  if(btnChangePassword) btnChangePassword.addEventListener('click', async ()=>{
    const cur = document.querySelector('[name=cur]').value;
    const nw = document.querySelector('[name=new]').value;
    if(nw.length < 6){ toast(state.appLang==='de'?'Neues Passwort ist zu kurz':state.appLang==='ar'?'كلمة المرور الجديدة قصيرة جدًا':'New password is too short'); return; }
    // Re-authenticate with the current password to verify it before changing to the new one.
    const { error: reauthErr } = await sb.auth.signInWithPassword({ email: state.user.email, password: cur });
    if(reauthErr){ toast(state.appLang==='de'?'Aktuelles Passwort ist falsch':state.appLang==='ar'?'كلمة المرور الحالية غير صحيحة':'Current password is incorrect'); return; }
    const { error } = await sb.auth.updateUser({ password: nw });
    if(error){ toast(errMsg(error)); return; }
    toast(T('savedChanges'));
  });
}

/* Boot */
if(state.appLang){ document.documentElement.lang = state.appLang; document.documentElement.dir = state.appLang==='ar'?'rtl':'ltr'; }
render();

let authListenerReady = false;
sb.auth.onAuthStateChange((event, session)=>{
  if(!authListenerReady){ authListenerReady = true; return; } // initial event handled by boot() below
  if(event === 'SIGNED_OUT'){ resetToSignedOut(); render(); return; }
});

async function boot(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      await loadAllData();
      state.route = 'dashboard';
    }
  }catch(err){
    toast(errMsg(err));
  }finally{
    state.booting = false;
    render();
  }
}
boot();
</script>
</body>
</html>
